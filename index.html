<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proyecto 1</title>
</head>
<body class="bg-dark">
    <div class="container mt-4">
        <div class="row justify-content-center">
            <div class="col text-center">
                <h1 class="text-danger display-3"><i class="fa-solid fa-dragon"></i>Dragon Ball GAME<i class="fa-solid fa-dragon"></i></h1>
            </div>   
        </div>
        <div id="nombres" class="row justify-content-around mt-4">
                <div class="col-md-5">
                    <div class="form-floating border border-danger rounded mb-3">
                        <input type="text" id="player1" class="form-control" placeholder="Jugador 1">
                        <label for="player1" class="text-danger"><i class="fa-solid fa-user-injured"></i>Jugador 1</label>
                    </div>
                </div>
                <div class="col-md-5">
                    <div class="form-floating border border-primary rounded mb-3">
                        <input type="text" id="player2" class="form-control" placeholder="Jugador 2">
                        <label for="player2" class="text-primary"><i class="fa-solid fa-user-injured"></i>Jugador 2</label>
                    </div>
                </div>
        </div>
        <div class="row justify-content-around mt-3">
            <div id="py1" class="col-md-5 text-center">
                <span class="text-danger">Seleccionar personaje</span>
                <div class="row mt-4">
                    <div class="col-3">
                        <img class="img-fluid rounded-circle bg-danger border-danger" src="./public/Img/seleccion/05.png" alt="Goku">
                    </div>
                    <div class="col-3">
                        <img class="img-fluid rounded-circle bg-danger border-danger" src="./public/Img/seleccion/01.png" alt="Veguito">
                    </div>
                    <div class="col-3">
                        <img class="img-fluid rounded-circle bg-danger border-danger" src="./public/Img/seleccion/03.png" alt="Trunks">
                    </div>  
                    <div class="col-3">
                        <img class="img-fluid rounded-circle bg-danger border-danger" src="./public/Img/seleccion/06.png" alt="Gohan">
                    </div>

                </div>
                <button type="button" id="btn_player1" class="btn btn-danger w-100 mt-4">Aceptar<i class="fa-solid fa-dice"></i></button>
            </div>
            <div id="py2" class="col-md-5 text-center">
                <span class="text-primary">Seleccionar personaje</span>
                <div class="row mt-4">
                    <div class="col-3">
                        <img class="img-fluid rounded-circle bg-primary border-primary" src="./public/Img/seleccion/02.png" alt="Veguetta">
                    </div>
                    <div class="col-3">
                        <img class="img-fluid rounded-circle bg-primary border-primary" src="./public/Img/seleccion/04.png" alt="Pikoro">
                    </div>
                    <div class="col-3">
                        <img class="img-fluid rounded-circle bg-primary border-primary" src="./public/Img/seleccion/08.png" alt="Cell">
                    </div>  
                    <div class="col-3">
                        <img class="img-fluid rounded-circle bg-primary border-primary" src="./public/Img/seleccion/07.png" alt="Gogueta">
                    </div>
                </div>
                <button type="button" id="btn_player2" class="btn btn-primary w-100 mt-4">Aceptar<i class="fa-solid fa-dice"></i></button>
            </div>
        </div>
            <div id="cargando" class="d-none">
                <div class="pantalla-carga">
                    <div class="aura"></div>
                    <div class="spinner-border text-warning" role="status">
                    <span class="visually-hidden">Cargando...</span>
                </div>
                <p>Los jugadores estan reuniendo su Ki...</p>
            </div>
        </div>
        <div class="row justify-content-around d-none" id="Batalla">
            <div class="col-md-5">
                <h2 id="username1" class="text-danger"></h2>
                <p id="personaje1" class="lead fs-4 "></p>
                <label for="vida1" class="text-success fw-bold">Vida</label>
                <div class="progress">
                    <div id="vida1" class="progress-bar bg-success" role="progressbar" style="width: 100%;" aria-valuenow="100" aria-valuemin="0" aria-valuemax="100">100%</div>
                </div>
                <label for="ki1" class="text-primary fw-bold">Ki</label>
                <div class="progress">
                    <div id="ki1" class="progress-bar bg-primary" role="progressbar" style="width: 100%;" aria-valuenow="100" aria-valuemin="0" aria-valuemax="100">100%</div>
                </div>
                <label for="energia1" class="text-info fw-bold">Energia</label>
                <div class="progress">
                    <div id="energia1" class="progress-bar bg-info" role="progressbar" style="width: 100%;" aria-valuenow="100" aria-valuemin="0" aria-valuemax="100">100%</div>
                </div>
                <hr>
                <img id="img1" src="" alt="" class="img-fluid mx-auto d-block" width="50%"> 
                <div class="row">
                    <div id="btn_py1" class="col">
                        <button class="btn btn-warning me-2 mb-3">ATK Basico</button>
                        <button class="btn btn-danger me-2 mb-3">ATK Especial</button>
                        <button class="btn btn-info me-2 mb-3">Cargar Ki</button>
                        <button class="btn btn-success me-2 mb-3">Semilla <span class="badge bg-dark" id="semilla1">2</span></button>
                    </div>
                </div>
            </div>
            <div class="col-md-5">
                <h2 id="username2" class="text-danger"></h2>
                <p id="personaje2" class="lead fs-4 "></p>
                <label for="vida2" class="text-success fw-bold">Vida</label>
                <div class="progress">
                    <div id="vida2" class="progress-bar bg-success" role="progressbar" style="width: 100%;" aria-valuenow="100" aria-valuemin="0" aria-valuemax="100">100%</div>
                </div>
                <label for="ki2" class="text-primary fw-bold">Ki</label>
                <div class="progress">
                    <div id="ki2" class="progress-bar bg-primary" role="progressbar" style="width: 100%;" aria-valuenow="100" aria-valuemin="0" aria-valuemax="100">100%</div>
                </div>
                <label for="energia2" class="text-info fw-bold">Energia</label>
                <div class="progress">
                    <div id="energia2" class="progress-bar bg-info" role="progressbar" style="width: 100%;" aria-valuenow="100" aria-valuemin="0" aria-valuemax="100">100%</div>
                </div>
                <hr>
                <img id="img2" src="" alt="" class="img-fluid mx-auto d-block" width="50%"> 
                <div class="row">
                    <div id="btn_py2" class="col">
                        <button class="btn btn-warning me-2 mb-3">ATK Basico</button>
                        <button class="btn btn-danger me-2 mb-3">ATK Especial</button>
                        <button class="btn btn-info me-2 mb-3">Cargar Ki</button>
                        <button class="btn btn-success me-2 mb-3">Semilla <span class="badge bg-dark" id="semilla2">2</span></button>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="./bundle.js"></script>
</body>
</html>
